name: Build QR reference IPA

# Builds QRInjectionRef.ipa on a macOS runner.
# - No signing secrets set  -> unsigned .ipa (try this first; LambdaTest re-signs uploads).
# - Signing secrets set     -> archived and exported, signed .ipa.
# - LT_USERNAME/LT_ACCESS_KEY secrets set -> .ipa is also uploaded to LambdaTest real devices
#   and the returned lt://APP... id is shown in the run summary.

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Export method (only used when signing secrets are set)
        type: choice
        default: development
        options: [development, ad-hoc]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    env:
      SCHEME: QRInjectionRef
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.qrinjectionref' }}
      EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
      P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -version

      # ---------- Unsigned build (no signing secrets) ----------
      - name: Build unsigned IPA
        if: env.P12_BASE64 == ''
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p out/Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" out/Payload/
          (cd out && zip -qry "$SCHEME-unsigned.ipa" Payload)
          echo "IPA_PATH=out/$SCHEME-unsigned.ipa" >> "$GITHUB_ENV"

      # ---------- Signed build (signing secrets present) ----------
      - name: Import signing certificate and provisioning profile
        if: env.P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          # Xcode 16+ reads profiles from UserData; older Xcode from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      - name: Archive and export signed IPA
        if: env.P12_BASE64 != ''
        run: |
          set -euo pipefail
          if [ "$EXPORT_METHOD" = "ad-hoc" ]; then IDENTITY="Apple Distribution"; else IDENTITY="Apple Development"; fi

          xcodebuild archive \
            -project "$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "build/$SCHEME.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "build/$SCHEME.xcarchive" \
            -exportPath out -exportOptionsPlist build/ExportOptions.plist
          echo "IPA_PATH=out/$SCHEME.ipa" >> "$GITHUB_ENV"

      # ---------- Outputs ----------
      - name: Save IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRInjectionRef-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload IPA to LambdaTest (optional)
        if: env.LT_USERNAME != '' && env.LT_ACCESS_KEY != ''
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -u "$LT_USERNAME:$LT_ACCESS_KEY" \
            -X POST "https://manual-api.lambdatest.com/app/upload/realDevice" \
            -F "appFile=@$IPA_PATH" -F "name=$(basename "$IPA_PATH")" | tee lt-upload.json
          APP_URL=$(python3 -c 'import json;print(json.load(open("lt-upload.json")).get("app_url",""))')
          {
            echo "### LambdaTest upload"
            echo ""
            echo "app_url: \`${APP_URL:-see log}\`"
            echo ""
            echo "Run the test with: \`LT_APP_URL=$APP_URL LT_MEDIA_URL=lt://MEDIA... npm test\`"
          } >> "$GITHUB_STEP_SUMMARY"
